name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  actions: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      # Required for Playwright e2e tests
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: Lint affected projects
        run: npx nx affected -t lint --base=origin/main

      - name: Test affected projects
        run: npx nx affected -t test --base=origin/main 

      - name: Build affected projects
        run: npx nx affected -t build --base=origin/main  

      - name: Run affected e2e tests
        run: npx nx affected -t e2e --base=origin/main
      
      - name: Nx CI diagnostic
        if: always()
        run: npx nx fix-ci